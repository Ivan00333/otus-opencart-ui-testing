

services:

  phpadmin:
    image: 'phpmyadmin/phpmyadmin:latest'
    environment:
      - PMA_HOST=mariadb
      - PMA_PORT=3306
      - PMA_USER=bn_opencart
    ports:
      - '8888:80'

  mariadb:
    image: docker.io/bitnami/mariadb:11.2
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_USER=bn_opencart
      - MARIADB_DATABASE=bitnami_opencart
    volumes:
      - 'mariadb_data:/bitnami/mariadb'
    ports:
      - '3306:3306'
    networks:
      - selenoid

  opencart:
    image: docker.io/bitnami/opencart:4.0.2-3
    ports:
      - '8081:8080'
      - '443:8443'
    environment:
      - OPENCART_HOST=127.0.0.1:8081
      - OPENCART_DATABASE_HOST=mariadb
      - OPENCART_DATABASE_PORT_NUMBER=3306
      - OPENCART_DATABASE_USER=bn_opencart
      - OPENCART_DATABASE_NAME=bitnami_opencart
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - 'opencart_data:/bitnami/opencart'
      - 'opencart_storage_data:/bitnami/opencart_storage/'
    depends_on:
      - mariadb
    networks:
      - selenoid

  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    networks:
      - selenoid
    ports:
      - 4444:4444
    volumes:
      - ./selenoid/browsers.json:/etc/selenoid/browsers.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: [
      "-conf=/etc/selenoid/browsers.json",
      "-video-output-dir=/opt/selenoid/video",
      "-log-output-dir=/opt/selenoid/logs",
      "-container-network=selenoid"
    ]
    restart: unless-stopped

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid-ui
    restart: unless-stopped
    networks:
      - selenoid
    depends_on:
      - selenoid
    ports:
      - 8090:8090
    environment:
      - SELENOID_HOST=selenoid
      - SELENOID_PORT=4444
    command: [ "--selenoid-uri=http://selenoid:4444", "-listen", ":8090" ]

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tests
    depends_on:
      - selenoid
    networks:
      - selenoid
    volumes:
      - ./:/app
    working_dir: /app
    command: ./wait-for-it.sh opencart 8080 pytest -v tests/* --headless --base_url http://opencart:8080 --executor selenoid

networks:
  selenoid:
    name: selenoid
    external: true

volumes:
  mariadb_data:
    driver: local
  opencart_data:
    driver: local
  opencart_storage_data:
    driver: local
